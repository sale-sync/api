version = 0.1

# Affiliate API (backlog affiliate-api). Staging only for now; the prod block comes with the affiliate user pool.

[staging.deploy.parameters]
stack_name = "staging-sale-sync-affiliate-api"
resolve_s3 = true
s3_prefix = "staging-sale-sync-affiliate-api"
region = "ap-southeast-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
image_repositories = []
parameter_overrides = [
  "ParameterKey=AffiliateTableName,ParameterValue=staging-sale-sync-affiliate"
]
