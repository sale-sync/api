AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Sale Sync Images Infrastructure (S3)

Resources:
    # -------------------------------------------------------------------------
    # S3 Bucket for Access Logs
    # -------------------------------------------------------------------------
    # NOTE: cfn-guard warnings are suppressed below because:
    # 1. SSL_REQUESTS_ONLY - Enforced via separate ImageBucketLogsPolicy resource (DenyNonSSLRequests statement)
    # 2. LOGGING_ENABLED - This bucket logs to itself using string reference to avoid circular dependency
    # 3. VERSIONING_ENABLED - Not required for logs bucket, lifecycle policy handles cleanup
    # The security controls ARE implemented, but cfn-guard can't detect policies in separate resources.
    # -------------------------------------------------------------------------
    ImageBucketLogs:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Metadata:
            cfn-guard:
                SuppressedRules:
                    - S3_BUCKET_SSL_REQUESTS_ONLY
                    - S3_BUCKET_LOGGING_ENABLED
                    - S3_BUCKET_VERSIONING_ENABLED
        Properties:
            BucketName: !Sub sale-sync-images-logs-${AWS::AccountId}-${AWS::Region}
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                          SSEAlgorithm: AES256
            LoggingConfiguration:
                DestinationBucketName: !Sub sale-sync-images-logs-${AWS::AccountId}-${AWS::Region}
                LogFilePrefix: self-logs/
            LifecycleConfiguration:
                Rules:
                    - Id: DeleteOldLogs
                      Status: Enabled
                      ExpirationInDays: 90

    # -------------------------------------------------------------------------
    # Bucket Policy for ImageBucketLogs
    # IMPORTANT: This policy implements the security controls for ImageBucketLogs:
    # - S3ServerAccessLogsPolicy: Allows S3 logging service to write logs
    # - DenyNonSSLRequests: Denies all non-HTTPS requests (SSL enforcement)
    # -------------------------------------------------------------------------
    ImageBucketLogsPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref ImageBucketLogs
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: S3ServerAccessLogsPolicy
                      Effect: Allow
                      Principal:
                          Service: logging.s3.amazonaws.com
                      Action: s3:PutObject
                      Resource: !Sub arn:aws:s3:::sale-sync-images-logs-${AWS::AccountId}-${AWS::Region}/*
                      Condition:
                          ArnLike:
                              aws:SourceArn:
                                  - !Sub arn:aws:s3:::sale-sync-images-${AWS::AccountId}-${AWS::Region}
                                  - !Sub arn:aws:s3:::sale-sync-images-logs-${AWS::AccountId}-${AWS::Region}
                          StringEquals:
                              aws:SourceAccount: !Ref AWS::AccountId
                    - Sid: DenyNonSSLRequests
                      Effect: Deny
                      Principal: '*'
                      Action: s3:*
                      Resource:
                          - !Sub arn:aws:s3:::sale-sync-images-logs-${AWS::AccountId}-${AWS::Region}
                          - !Sub arn:aws:s3:::sale-sync-images-logs-${AWS::AccountId}-${AWS::Region}/*
                      Condition:
                          Bool:
                              aws:SecureTransport: 'false'

    # -------------------------------------------------------------------------
    # S3 Bucket for Image Storage
    # -------------------------------------------------------------------------
    # NOTE: cfn-guard warnings are suppressed below because:
    # 1. SSL_REQUESTS_ONLY - Enforced via separate ImageBucketPolicy resource (DenyNonSSLRequests statement)
    # 2. VERSIONING_ENABLED - Not required, lifecycle policy handles cleanup of old versions
    # The security control IS implemented, but cfn-guard can't detect policies in separate resources.
    # -------------------------------------------------------------------------
    ImageBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Metadata:
            cfn-guard:
                SuppressedRules:
                    - S3_BUCKET_SSL_REQUESTS_ONLY
                    - S3_BUCKET_VERSIONING_ENABLED
        Properties:
            BucketName: !Sub sale-sync-images-${AWS::AccountId}-${AWS::Region}
            LoggingConfiguration:
                DestinationBucketName: !Ref ImageBucketLogs
                LogFilePrefix: images-access-logs/
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                          SSEAlgorithm: AES256
            CorsConfiguration:
                CorsRules:
                    - AllowedHeaders:
                          - '*'
                      AllowedMethods:
                          - GET
                          - PUT
                          - POST
                          - DELETE
                          - HEAD
                      AllowedOrigins:
                          - https://app.salesync.biz
                          - https://app.salesync.local
                          - https://staging.salesync.biz
                          - http://localhost:3000
                          - http://127.0.0.1:3000
                      ExposedHeaders:
                          - ETag
                          - x-amz-meta-media-id
                      MaxAge: 3600
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            LifecycleConfiguration:
                Rules:
                    - Id: DeletePendingUploads
                      Status: Enabled
                      AbortIncompleteMultipartUpload:
                          DaysAfterInitiation: 1
                    - Id: DeleteOldVersions
                      Status: Enabled
                      NoncurrentVersionExpiration:
                          NoncurrentDays: 30

    # -------------------------------------------------------------------------
    # Bucket Policy for ImageBucket
    # IMPORTANT: This policy implements the security controls for ImageBucket:
    # - DenyNonSSLRequests: Denies all non-HTTPS requests (SSL enforcement)
    # -------------------------------------------------------------------------
    ImageBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref ImageBucket
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Sid: DenyNonSSLRequests
                      Effect: Deny
                      Principal: '*'
                      Action: s3:*
                      Resource:
                          - !GetAtt ImageBucket.Arn
                          - !Sub ${ImageBucket.Arn}/*
                      Condition:
                          Bool:
                              aws:SecureTransport: 'false'

Outputs:
    ImageBucketName:
        Description: S3 Bucket for image storage
        Value: !Ref ImageBucket

    ImageBucketArn:
        Description: S3 Bucket ARN for image storage
        Value: !GetAtt ImageBucket.Arn

    ImageBucketLogsName:
        Description: S3 Bucket for image access logs
        Value: !Ref ImageBucketLogs
