AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Sales Sync Properties Infrastructure (DynamoDB)

Resources:
    # -------------------------------------------------------------------------
    # DynamoDB Table for Property listings
    # See docs/dynamodb/access-patterns/properties.md for the full key-schema rationale.
    # -------------------------------------------------------------------------
    PropertyTable:
        Type: AWS::DynamoDB::Table
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            TableName: sale-sync-properties
            BillingMode: PAY_PER_REQUEST
            SSESpecification:
                SSEEnabled: true
            AttributeDefinitions:
                - AttributeName: PK
                  AttributeType: S
                - AttributeName: SK
                  AttributeType: S
                - AttributeName: GSI1PK
                  AttributeType: S
                - AttributeName: GSI1SK
                  AttributeType: S
                - AttributeName: GSI2PK
                  AttributeType: S
                - AttributeName: GSI2SK
                  AttributeType: S
                - AttributeName: GSI3PK
                  AttributeType: S
                - AttributeName: GSI3SK
                  AttributeType: S
            KeySchema:
                - AttributeName: PK
                  KeyType: HASH
                - AttributeName: SK
                  KeyType: RANGE
            GlobalSecondaryIndexes:
                - IndexName: property-area-index
                  KeySchema:
                      - AttributeName: GSI1PK
                        KeyType: HASH
                      - AttributeName: GSI1SK
                        KeyType: RANGE
                  Projection:
                      ProjectionType: ALL
                - IndexName: property-type-index
                  KeySchema:
                      - AttributeName: GSI2PK
                        KeyType: HASH
                      - AttributeName: GSI2SK
                        KeyType: RANGE
                  Projection:
                      ProjectionType: ALL
                - IndexName: property-region-index
                  KeySchema:
                      - AttributeName: GSI3PK
                        KeyType: HASH
                      - AttributeName: GSI3SK
                        KeyType: RANGE
                  Projection:
                      ProjectionType: ALL

Outputs:
    PropertyTableName:
        Description: DynamoDB Table for property listings
        Value: !Ref PropertyTable

    PropertyTableArn:
        Description: DynamoDB Table ARN for property listings
        Value: !GetAtt PropertyTable.Arn
