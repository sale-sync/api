AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Sale Sync Admin API

Parameters:
    OrganisationTableName:
        Type: String
        Description: >
            Same Parameter name as api/template.yaml's OrganisationTableName (this app's DynamoDB
            table is the same physical sale-sync-organisation table) — renamed from this template's
            former generic TableName for consistency across both apps
            (backlogs/onboarding/children/organisation-approval-gate). Every admin-api function reads
            it via Globals below as ORGANISATION_TABLE_NAME, same env var name api/template.yaml uses.
    CognitoUrl:
        Type: String
    ClientId:
        Type: String
    ClientSecret:
        Type: String
    CognitoCallbackUrl:
        Type: String
        Description: >
            OAuth redirect_uri for the admin login flow (ss/admin's
            /api/auth/callback route) — must exactly match one of the
            admin Cognito app client's CallbackURLs (see
            infra/admin-cognito.yaml).
    InitWebsiteFunctionName:
        Type: String
        Description: >
            Name of ss/infra's InitWebsiteFunction (see backlogs/sync-templates) — same cross-stack
            Parameter reference api/template.yaml's OrganisationDefaultFunction already uses.
            SignupRequestsFunction invokes it fire-and-forget from
            createOrganisationFromApprovedRequest() when approving a real-estate signup request.

Globals:
    Function:
        Timeout: 10
        Environment:
            Variables:
                ORGANISATION_TABLE_NAME: !Ref OrganisationTableName
                COGNITO_URL: !Ref CognitoUrl
                CLIENT_ID: !Ref ClientId
                CLIENT_SECRET: !Ref ClientSecret
                COGNITO_CALLBACK_URL: !Ref CognitoCallbackUrl

Resources:
    # =========================================================================
    # API Gateway
    # =========================================================================
    SaleSyncAdminApi:
        Type: AWS::Serverless::Api
        Properties:
            StageName: Prod
            # Explicit Name (defaults to the logical ID otherwise, which is why the
            # earlier "SalesSyncAdminApi" typo showed up as the API Gateway console
            # name) — set to the stack name so it's unambiguous and independent of
            # any future logical-ID rename.
            Name: !Ref AWS::StackName

    # =========================================================================
    # Lambda Functions
    # =========================================================================

    # -------------------------------------------------------------------------
    # Payments Lambdas
    # -------------------------------------------------------------------------
    PaymentsFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/payments/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /payments/{proxy+}
                        Method: ANY

    PaymentsDefaultFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/payments/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /payments
                        Method: ANY

    # -------------------------------------------------------------------------
    # Promo Codes Lambdas
    # -------------------------------------------------------------------------
    PromoCodesFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/promo-codes/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /promo-codes/{proxy+}
                        Method: ANY

    PromoCodesDefaultFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/promo-codes/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /promo-codes
                        Method: ANY

    # -------------------------------------------------------------------------
    # Auth Lambdas (staff Cognito login/callback)
    # -------------------------------------------------------------------------
    AuthFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/auth/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /auth/{proxy+}
                        Method: ANY

    AuthDefaultFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/auth/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /auth
                        Method: ANY

    # -------------------------------------------------------------------------
    # Organisation Lambdas
    # -------------------------------------------------------------------------
    OrganisationFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/organisation/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /organisations/{proxy+}
                        Method: ANY

    OrganisationDefaultFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/organisation/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /organisations
                        Method: ANY

    # -------------------------------------------------------------------------
    # Signup Requests Lambdas (backlogs/onboarding/children/organisation-approval-gate)
    # -------------------------------------------------------------------------
    SignupRequestsFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/signup-requests/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Environment:
                Variables:
                    INIT_WEBSITE_FUNCTION_NAME: !Ref InitWebsiteFunctionName
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
                - Statement:
                      - Effect: Allow
                        Action: lambda:InvokeFunction
                        # Predictable ARN string (not !GetAtt), same idiom
                        # api/template.yaml's OrganisationDefaultFunction uses — init-website lives in
                        # a different SAM app/stack (ss/infra) than this one.
                        Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${InitWebsiteFunctionName}'
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /signup-requests/{proxy+}
                        Method: ANY

    SignupRequestsDefaultFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/admin-api/signup-requests/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
            Events:
                ApiRouter:
                    Type: Api
                    Properties:
                        RestApiId: !Ref SaleSyncAdminApi
                        Path: /signup-requests
                        Method: ANY

Outputs:
    AdminApiId:
        Description: API Gateway RestApi ID
        Value: !Ref SaleSyncAdminApi

    AdminApiInvokeUrl:
        Description: Invoke URL for the Prod stage
        Value: !Sub 'https://${SaleSyncAdminApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'

    PaymentsFunctionArn:
        Description: Payments Lambda Function ARN
        Value: !GetAtt PaymentsFunction.Arn

    OrganisationFunctionArn:
        Description: Organisation Lambda Function ARN
        Value: !GetAtt OrganisationFunction.Arn

    PromoCodesFunctionArn:
        Description: Promo Codes Lambda Function ARN
        Value: !GetAtt PromoCodesFunction.Arn

    AuthFunctionArn:
        Description: Auth Lambda Function ARN
        Value: !GetAtt AuthFunction.Arn

    SignupRequestsFunctionArn:
        Description: Signup Requests Lambda Function ARN
        Value: !GetAtt SignupRequestsFunction.Arn
