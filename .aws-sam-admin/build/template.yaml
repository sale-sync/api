AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sales Sync Admin API
Parameters:
  TableName:
    Type: String
  CognitoUrl:
    Type: String
  ClientId:
    Type: String
  ClientSecret:
    Type: String
Globals:
  Function:
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME:
          Ref: TableName
        COGNITO_URL:
          Ref: CognitoUrl
        CLIENT_ID:
          Ref: ClientId
        CLIENT_SECRET:
          Ref: ClientSecret
Resources:
  SalesSyncAdminApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
  PaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PaymentsFunction
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      Policies:
      - AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Events:
        ApiRouter:
          Type: Api
          Properties:
            RestApiId:
              Ref: SalesSyncAdminApi
            Path: /payments/{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: PaymentsFunction
  PaymentsDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PaymentsDefaultFunction
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      Policies:
      - AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Events:
        ApiRouter:
          Type: Api
          Properties:
            RestApiId:
              Ref: SalesSyncAdminApi
            Path: /payments
            Method: ANY
    Metadata:
      SamResourceId: PaymentsDefaultFunction
  PromoCodesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PromoCodesFunction
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      Policies:
      - AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Events:
        ApiRouter:
          Type: Api
          Properties:
            RestApiId:
              Ref: SalesSyncAdminApi
            Path: /promo-codes/{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: PromoCodesFunction
  PromoCodesDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PromoCodesDefaultFunction
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      Policies:
      - AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Events:
        ApiRouter:
          Type: Api
          Properties:
            RestApiId:
              Ref: SalesSyncAdminApi
            Path: /promo-codes
            Method: ANY
    Metadata:
      SamResourceId: PromoCodesDefaultFunction
  OrganisationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: OrganisationFunction
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      Policies:
      - AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Events:
        ApiRouter:
          Type: Api
          Properties:
            RestApiId:
              Ref: SalesSyncAdminApi
            Path: /organisations/{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: OrganisationFunction
  OrganisationDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: OrganisationDefaultFunction
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      Policies:
      - AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Events:
        ApiRouter:
          Type: Api
          Properties:
            RestApiId:
              Ref: SalesSyncAdminApi
            Path: /organisations
            Method: ANY
    Metadata:
      SamResourceId: OrganisationDefaultFunction
Outputs:
  AdminApiId:
    Description: API Gateway RestApi ID
    Value:
      Ref: SalesSyncAdminApi
  AdminApiInvokeUrl:
    Description: Invoke URL for the Prod stage
    Value:
      Fn::Sub: https://${SalesSyncAdminApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  PaymentsFunctionArn:
    Description: Payments Lambda Function ARN
    Value:
      Fn::GetAtt:
      - PaymentsFunction
      - Arn
  OrganisationFunctionArn:
    Description: Organisation Lambda Function ARN
    Value:
      Fn::GetAtt:
      - OrganisationFunction
      - Arn
  PromoCodesFunctionArn:
    Description: Promo Codes Lambda Function ARN
    Value:
      Fn::GetAtt:
      - PromoCodesFunction
      - Arn
