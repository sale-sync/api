AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Silas Tech Affiliate API (backlog affiliate-api). One Lambda under /affiliates and its DynamoDB table (single-table layout, see apps/affiliate-api/affiliates/store/dynamo-store.ts). No Cognito authorizer yet (mock sign-in).

Parameters:
    AffiliateTableName:
        Type: String
        Description: The affiliate table of this stage (staging-sale-sync-affiliate, later sale-sync-affiliate)

Globals:
    Function:
        Timeout: 10
        Environment:
            Variables:
                AFFILIATE_TABLE_NAME: !Ref AffiliateTableName

Resources:
    # Affiliates, their links (and the address reservations), referrals and payout methods. Kept if the stack is removed.
    AffiliateTable:
        Type: AWS::DynamoDB::Table
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            TableName: !Ref AffiliateTableName
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - AttributeName: PK
                  AttributeType: S
                - AttributeName: SK
                  AttributeType: S
            KeySchema:
                - AttributeName: PK
                  KeyType: HASH
                - AttributeName: SK
                  KeyType: RANGE
            PointInTimeRecoverySpecification:
                PointInTimeRecoveryEnabled: true

    AffiliateApi:
        Type: AWS::Serverless::Api
        Properties:
            StageName: Prod

    # One Lambda for every /affiliates route; samjs routes inside it (account, application, links, referrals, payouts,
    # payout-method, programme). ANY so OPTIONS reaches withCORS for the preflight.
    AffiliatesFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/affiliate-api/affiliates/bundle
            Handler: app.lambdaHandler
            Runtime: nodejs22.x
            Architectures: [x86_64]
            Policies:
                - AWSLambdaBasicExecutionRole
                - DynamoDBCrudPolicy:
                      TableName: !Ref AffiliateTable
            Events:
                AffiliatesProxy:
                    Type: Api
                    Properties:
                        RestApiId: !Ref AffiliateApi
                        Path: /affiliates/{proxy+}
                        Method: ANY
                Affiliates:
                    Type: Api
                    Properties:
                        RestApiId: !Ref AffiliateApi
                        Path: /affiliates
                        Method: ANY

Outputs:
    AffiliateApiInvokeUrl:
        Description: Invoke URL for the Prod stage
        Value: !Sub 'https://${AffiliateApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
